name: Publish to NuGet

# Tag a commit as v1.2.3 and push the tag: the package is versioned, packed and pushed.
# Uses nuget.org Trusted Publishing (no API key secret needed).
on:
  push:
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # required for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore -p:Version=$VERSION
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack src/SlimMediator/SlimMediator.csproj --configuration Release --no-build -p:Version=$VERSION

      - name: Log in to nuget.org (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: eranga.ananda

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2